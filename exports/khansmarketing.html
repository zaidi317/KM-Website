    function pickRandomSites(category, count, previousIds) {
      const pool = category === 'all' ? PORTFOLIO_CATALOG : PORTFOLIO_CATALOG.filter(i => i.category === category);
      const shuffle = (arr) => {
        const c = arr.slice();
        for (let i = c.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = c[i]; c[i] = c[j]; c[j] = tmp;
        }
        return c;
      };
      if (pool.length <= count) return shuffle(pool);
      const fresh = pool.filter(i => !(previousIds || []).includes(i.id));
      const stale = pool.filter(i => (previousIds || []).includes(i.id));
      return shuffle(fresh).concat(shuffle(stale)).slice(0, count);
    }

    function observeReveals() {
      const nodes = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        nodes.forEach(n => n.classList.add('in'));
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      nodes.forEach(n => io.observe(n));
    }

    function bindPageEvents() {
      document.querySelectorAll('[data-hometab]').forEach(b => b.addEventListener('click', () => { state.homeTab = b.dataset.hometab; renderPage(); }));
      document.querySelectorAll('[data-seotab]').forEach(b => b.addEventListener('click', () => { state.seoTab = b.dataset.seotab; renderPage(); }));
      document.querySelectorAll('[data-pcat]').forEach(b => b.addEventListener('click', () => {
        state.portfolioCategory = b.dataset.pcat;
        state.portfolioItems = pickRandomSites(state.portfolioCategory, 6, []);
        renderPage();
      }));
      const fetchBtn = document.getElementById('fetch-random-btn');
      if (fetchBtn) {
        fetchBtn.addEventListener('click', () => {
          const prevIds = state.portfolioItems.map(i => i.id);
          state.portfolioItems = pickRandomSites(state.portfolioCategory, 6, prevIds);
          renderPage();
        });
      }
      document.querySelectorAll('[data-faq]').forEach(b => b.addEventListener('click', () => {
        const idx = Number(b.dataset.faq);
        state.openFaq = state.openFaq === idx ? -1 : idx;
        renderPage();
      }));
      document.querySelectorAll('.js-book').forEach(b => b.addEventListener('click', openBookModal));
      const form = document.getElementById('km-lead-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const data = Object.fromEntries(new FormData(form).entries());
          const errs = {};
          const f = t().contactPage.form;
          if (String(data.companyFaxTrap || '').trim()) return;
          if (String(data.fullName || '').trim().length < 2) errs.fullName = f.errors.required_name;
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(data.email || '').trim())) errs.email = f.errors.invalid_email;
          const digits = String(data.phone || '').replace(/\D/g, '');
          if (digits.length < 7 || digits.length > 16) errs.phone = f.errors.invalid_phone;
          if (String(data.company || '').trim().length < 2) errs.company = f.errors.required_company;
          if (String(data.websiteUrl || '').trim()) {
            try { new URL(/^https?:\/\//i.test(data.websiteUrl) ? data.websiteUrl : 'https://' + data.websiteUrl); } catch { errs.websiteUrl = f.errors.invalid_url; }
          }
          if (String(data.projectDetails || '').trim().length < 15) errs.projectDetails = f.errors.short_details;
          ['fullName','email','phone','company','websiteUrl','projectDetails'].forEach(k => {
            const el = document.getElementById('err-' + k);
            if (el) el.textContent = errs[k] || '';
          });
          if (Object.keys(errs).length > 0) return;
          const mailto = 'mailto:' + KM_CONFIG.recipientEmail + '?subject=' + encodeURIComponent('Project Enquiry: ' + data.company) + '&body=' + encodeURIComponent(data.fullName + ' (' + data.email + ', ' + data.phone + ')\n\n' + data.projectDetails);
          document.getElementById('lead-form-host').innerHTML = `
            <div class="card" role="status">
              <p class="eyebrow">${esc(f.devConfirmation.badge)}</p>
              <h2 style="font-size:1.35rem;margin-bottom:0.65rem;">${esc(f.devConfirmation.title)}</h2>
              <p style="color:var(--muted);font-size:0.92rem;margin-bottom:1rem;">${esc(f.devConfirmation.body)}</p>
              <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                <a class="btn btn-emerald" href="${mailto}">${esc(f.devConfirmation.mailtoButton)}</a>
                <button type="button" class="btn btn-outline-light" id="reset-form-btn">${esc(f.devConfirmation.resetButton)}</button>
              </div>
            </div>`;
          document.getElementById('reset-form-btn').addEventListener('click', renderPage);
        });
      }
      observeReveals();
    }

    function renderPage() {
      const host = document.getElementById('app-main');
      if (state.route === 'home') host.innerHTML = renderHome();
      else if (state.route === 'portfolio') host.innerHTML = renderPortfolio();
      else if (state.route === 'about') host.innerHTML = renderAbout();
      else if (state.route === 'contact') host.innerHTML = renderContact();
      else host.innerHTML = renderServicePage(state.route);
      bindPageEvents();
    }

    function openBookModal() {
      if (KM_CONFIG.bookingUrl) { window.location.href = KM_CONFIG.bookingUrl; return; }
      document.getElementById('book-modal').classList.add('open');
    }
    function closeBookModal() {
      document.getElementById('book-modal').classList.remove('open');
    }

    document.addEventListener('click', (e) => {
      const routeBtn = e.target.closest('[data-route]');
      if (routeBtn) { e.preventDefault(); navigate(routeBtn.dataset.route); }
      if (!e.target.closest('.dropdown')) document.getElementById('services-dropdown').classList.remove('open');
    });
    document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));
    document.getElementById('nav-services-btn').addEventListener('click', () => document.getElementById('services-dropdown').classList.toggle('open'));
    document.getElementById('mobile-menu-btn').addEventListener('click', () => document.getElementById('mobile-drawer').classList.toggle('open'));
    document.getElementById('header-book-btn').addEventListener('click', openBookModal);
    document.getElementById('mobile-book-btn').addEventListener('click', openBookModal);
    document.getElementById('modal-close-x').addEventListener('click', closeBookModal);
    document.getElementById('modal-close-btn').addEventListener('click', closeBookModal);
    document.getElementById('modal-contact-btn').addEventListener('click', () => { closeBookModal(); navigate('contact'); });
    document.getElementById('modal-copy-btn').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(KM_CONFIG.phoneRaw).then(() => {
          document.getElementById('modal-copy-btn').textContent = t().bookModal.copiedLabel;
          setTimeout(() => { document.getElementById('modal-copy-btn').textContent = t().bookModal.copyNumberAction; }, 2200);
        }).catch(() => {});
      }
    });

    setLanguage(state.lang);
  </script>
</body>
</html>
